# Default configuration for antifraudies.
# Override any value with an environment variable prefixed ANTIFRAUDIES_ and using
# "__" as the nesting delimiter, e.g. ANTIFRAUDIES_CRAWL__CONCURRENCY=32

[paths]
# Image bytes live on disk (immutable, content-addressed); metadata/features live in Postgres.
# data_dir holds blobs/ and cache/. Default is <repo>/data; point it anywhere (e.g. an
# external SSD) with the ANTIFRAUDIES_DATA_DIR env var — see the README "Storage" section.
data_dir = "data"
blobs_subdir = "blobs"       # content-addressed image bytes (deduped across the whole catalog)
cache_subdir = "cache"       # on-disk HTTP cache (small things only; see cache_enabled)

[database]
# PostgreSQL + pgvector. libpq DSN; default connects locally as the current user.
# Override with ANTIFRAUDIES_DATABASE__DSN=postgresql://user:pass@host:5432/antifraudies
dsn = "postgresql:///antifraudies"

[crawl]
# Honest identification: a truthful UA token plus a contact. We send realistic Accept
# headers (the target's Akamai edge requires them) but do not disguise our identity.
user_agent = "antifraudies-research-crawler/0.1 (+https://example.org/antifraudies; research-integrity image-provenance study)"
contact = "boyd@pldm.ai"

# Throughput. The goal is to finish the full ~261K-product catalog (~1M requests incl.
# images) in well under a day. We run many requests in flight over HTTP/2 with no fixed
# inter-request delay; measured ~30 req/s at concurrency 48 -> ~9h for the whole catalog
# (raise -c for ~6h, lower it to be gentler). We still back off on 429/5xx and respect
# robots.txt — fast is not the same as abusive.
concurrency = 32                 # max requests in flight at once
min_interval_seconds = 0.0       # fixed gap between requests to a host (0 = none)
max_retries = 4                  # on 429 / 5xx / transport errors
backoff_base_seconds = 1.0       # exponential: base * 2**attempt (+ jitter)
backoff_max_seconds = 60.0
jitter_seconds = 0.5             # random 0..jitter added to backoff waits
timeout_seconds = 30.0
respect_robots = true

# The HTTP cache is OFF by default: for a one-shot full crawl it would duplicate every
# image and page on disk. Enable only for small incremental/seed runs where re-fetching
# the same URL twice is the thing you want to avoid.
cache_enabled = false

[zenodo]
# The curated set of documented problematic images (labeled positives for phase 2).
# We record the manifest now; downloading the image bytes is deferred to phase 2.
doi = "10.5281/zenodo.20402475"
download_bytes = false
